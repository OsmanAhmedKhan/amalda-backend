services:
  - type: web
    name: amalda-backend
    env: docker
    plan: starter
    region: ohio
    healthCheckPath: /health
    # No persistent disk on Render free tier - filesystem is ephemeral.
    # Files go to InsForge S3; vectors are in-memory (lost on restart, re-indexed on re-upload).
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
